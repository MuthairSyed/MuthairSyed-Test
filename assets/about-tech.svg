<svg xmlns="http://www.w3.org/2000/svg"
     width="1300"
     height="1050"
     viewBox="0 0 1300 1050">

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#0b0d10"/>
    </linearGradient>

    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111419"/>
      <stop offset="100%" stop-color="#050607"/>
    </linearGradient>

    <pattern id="grid"
             width="45"
             height="45"
             patternUnits="userSpaceOnUse">
      <path d="M45 0H0V45"
            fill="none"
            stroke="#ffffff"
            stroke-opacity=".05"
            stroke-width="1"/>
    </pattern>

    <pattern id="scan"
             width="1"
             height="8"
             patternUnits="userSpaceOnUse">
      <rect width="1"
            height="1"
            fill="#ffffff"
            opacity=".025"/>
    </pattern>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- BACKGROUND -->

  <rect width="1300"
        height="1050"
        fill="url(#bg)"/>

  <rect width="1300"
        height="1050"
        fill="url(#grid)"/>

  <rect width="1300"
        height="1050"
        fill="url(#scan)"/>


  <!-- PARTICLES -->

  <g fill="#ffffff">

    <circle cx="80" cy="100" r="2">
      <animate attributeName="opacity"
               values=".1;.9;.1"
               dur="3s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="210" cy="180" r="1.5">
      <animate attributeName="cy"
               values="180;205;180"
               dur="4s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="390" cy="90" r="2">
      <animate attributeName="opacity"
               values=".1;1;.1"
               dur="2.8s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="600" cy="155" r="1.5">
      <animate attributeName="cy"
               values="155;175;155"
               dur="3.5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="850" cy="95" r="2">
