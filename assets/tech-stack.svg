<svg xmlns="http://www.w3.org/2000/svg"
     width="1300"
     height="300"
     viewBox="0 0 1300 300">

  <defs>

    <linearGradient id="bg"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">

      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#0D0D0D"/>

    </linearGradient>

    <filter id="glow">

      <feGaussianBlur stdDeviation="2"
                      result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

  </defs>


  <!-- BACKGROUND -->

  <rect width="1300"
        height="300"
        fill="url(#bg)"/>


  <!-- GRID -->

  <g stroke="#151515"
     stroke-width="1">

    <path d="M0 60H1300"/>
    <path d="M0 120H1300"/>
    <path d="M0 180H1300"/>
    <path d="M0 240H1300"/>

    <path d="M100 0V300"/>
    <path d="M200 0V300"/>
    <path d="M300 0V300"/>
    <path d="M400 0V300"/>
    <path d="M500 0V300"/>
    <path d="M600 0V300"/>
    <path d="M700 0V300"/>
    <path d="M800 0V300"/>
    <path d="M900 0V300"/>
    <path d="M1000 0V300"/>
    <path d="M1100 0V300"/>
    <path d="M1200 0V300"/>

  </g>


  <!-- FRAME -->

  <rect x="18"
        y="18"
        width="1264"
        height="264"
        fill="none"
        stroke="#333333"/>


  <!-- CORNERS -->

  <path d="M18 55V18H55"
        stroke="#FFFFFF"
        stroke-width="2"
        fill="none"/>

  <path d="M1245 18H1282V55"
        stroke="#FFFFFF"
        stroke-width="2"
        fill="none"/>

  <path d="M18 245V282H55"
        stroke="#FFFFFF"
        stroke-width="2"
        fill="none"/>

  <path d="M1245 282H1282V245"
        stroke="#FFFFFF"
        stroke-width="2"
        fill="none"/>


  <!-- HEADER -->

  <text x="45"
        y="53"
        fill="#FFFFFF"
        font-family="monospace"
        font-size="17"
        font-weight="bold">

    // TECH_STACK

  </text>


  <text x="1255"
        y="53"
        fill="#666666"
        font-family="monospace"
        font-size="11"
        text-anchor="end">

    MODULES_LOADED

  </text>


  <!-- STATUS -->

  <circle cx="48"
          cy="78"
          r="3"
          fill="#FFFFFF"
          filter="url(#glow)">

    <animate attributeName="opacity"
             values=".2;1;.2"
             dur="1.5s"
             repeatCount="indefinite"/>

  </circle>


  <text x="60"
        y="82"
        fill="#AAAAAA"
        font-family="monospace"
        font-size="11">

    SECURITY / DEVOPS / DEVELOPMENT

  </text>


  <!-- DIVIDER -->

  <line x1="42"
        y1="98"
        x2="1258"
        y2="98"
        stroke="#333333"/>


  <!-- LANGUAGE BLOCK -->

  <text x="55"
        y="128"
        fill="#777777"
        font-family="monospace"
        font-size="11">

    LANGUAGES

  </text>

  <text x="210"
        y="128"
        fill="#FFFFFF"
        font-family="monospace"
        font-size="12">

    Python  •  PowerShell  •  Java  •  JavaScript  •  HTML  •  CSS

  </text>


  <!-- CLOUD BLOCK -->

  <text x="55"
        y="158"
        fill="#777777"
        font-family="monospace"
        font-size="11">

    CLOUD / DEVOPS

  </text>

  <text x="210"
        y="158"
        fill="#FFFFFF"
        font-family="monospace"
        font-size="12">

    Azure  •  GitHub  •  GitLab  •  Docker  •  Linux  •  Jenkins

  </text>


  <!-- SECURITY BLOCK -->

  <text x="55"
        y="188"
        fill="#777777"
        font-family="monospace"
        font-size="11">

    SECURITY

  </text>

  <text x="210"
        y="188"
        fill="#FFFFFF"
        font-family="monospace"
        font-size="12">

    Microsoft Defender  •  Burp Suite  •  Aqua Security

  </text>


  <!-- SECURITY CONTINUED -->

  <text x="210"
        y="212"
        fill="#FFFFFF"
        font-family="monospace"
        font-size="12">

    SAST  •  SCA  •  DAST  •  OWASP  •  Vulnerability Management

  </text>


  <!-- WEB -->

  <text x="55"
        y="242"
        fill="#777777"
        font-family="monospace"
        font-size="11">

    WEB / DATA

  </text>

  <text x="210"
        y="242"
        fill="#FFFFFF"
        font-family="monospace"
        font-size="12">

    PHP  •  MySQL  •  JavaScript  •  Responsive Web Applications

  </text>


  <!-- LIVE CURSOR -->

  <text x="55"
        y="268"
        fill="#FFFFFF"
        font-family="monospace"
        font-size="11">

    &gt; loading_security_modules_

    <animate attributeName="opacity"
             values="1;0;1"
             dur="1.1s"
             repeatCount="indefinite"/>

  </text>


  <!-- SCAN LINE -->

  <rect x="20"
        y="20"
        width="2"
        height="260"
        fill="#FFFFFF"
        opacity=".06">

    <animate attributeName="x"
             values="20;1280;20"
             dur="8s"
             repeatCount="indefinite"/>

  </rect>


  <!-- ACTIVITY LINE -->

  <path d="M1050 260
           L1070 260
           L1080 245
           L1090 270
           L1105 252
           L1115 260
           L1130 260
           L1140 240
           L1150 270
           L1165 260
           L1180 260
           L1190 248
           L1200 260
           L1250 260"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="1"
        opacity=".45">

    <animate attributeName="opacity"
             values=".2;.8;.2"
             dur="3s"
             repeatCount="indefinite"/>

  </path>

</svg>
