<svg xmlns="http://www.w3.org/2000/svg"
     width="1300"
     height="760"
     viewBox="0 0 1300 760">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020202"/>
      <stop offset="100%" stop-color="#0b0f14"/>
    </linearGradient>

    <!-- Grid -->
    <pattern id="grid"
             width="32"
             height="32"
             patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32"
            fill="none"
            stroke="#ffffff"
            stroke-opacity="0.055"
            stroke-width="1"/>
    </pattern>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3"
                      result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow -->
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <!-- Scanline -->
    <linearGradient id="scan"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="0">
      <stop offset="0%"
            stop-color="#ffffff"
            stop-opacity="0"/>
      <stop offset="50%"
            stop-color="#ffffff"
            stop-opacity="0.25"/>
      <stop offset="100%"
            stop-color="#ffffff"
            stop-opacity="0"/>
    </linearGradient>

    <!-- Animated particles -->
    <circle id="particle"
            r="1.5"
            fill="#ffffff"
            opacity="0.65"/>

  </defs>


  <!-- ===================================================== -->
  <!-- BACKGROUND -->
  <!-- ===================================================== -->

  <rect width="1300"
        height="760"
        fill="url(#bg)"/>

  <rect width="1300"
        height="760"
        fill="url(#grid)"/>


  <!-- ===================================================== -->
  <!-- BORDER -->
  <!-- ===================================================== -->

  <rect x="22"
        y="22"
        width="1256"
        height="716"
        rx="8"
        fill="none"
        stroke="#ffffff"
        stroke-opacity="0.20"/>

  <path d="M22 58 H170"
        stroke="#ffffff"
        stroke-opacity="0.35"/>

  <path d="M1130 58 H1278"
        stroke="#ffffff"
        stroke-opacity="0.35"/>


  <!-- ===================================================== -->
  <!-- PARTICLES -->
  <!-- ===================================================== -->

  <g>

    <use href="#particle"
         x="95"
         y="110">
      <animate attributeName="opacity"
               values="0.1;0.8;0.1"
               dur="3s"
               repeatCount="indefinite"/>
    </use>

    <use href="#particle"
         x="210"
         y="250">
