<svg xmlns="http://www.w3.org/2000/svg"
     width="1300"
     height="260"
     viewBox="0 0 1300 260">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>

    <!-- Grid -->
    <pattern id="grid"
             width="35"
             height="35"
             patternUnits="userSpaceOnUse">

      <path
        d="M35 0H0V35"
        fill="none"
        stroke="#151515"
        stroke-width="1"/>

    </pattern>

    <!-- Glow -->
    <filter id="glow">

      <feGaussianBlur
        stdDeviation="3"
        result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

    <!-- Stronger glow -->
    <filter id="strongGlow">

      <feGaussianBlur
        stdDeviation="7"
        result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND -->
  <!-- ================================================= -->

  <rect
    width="1300"
    height="260"
    fill="url(#bg)"/>

  <rect
    width="1300"
    height="260"
    fill="url(#grid)"/>


  <!-- ================================================= -->
  <!-- TOP BORDER -->
  <!-- ================================================= -->

  <line
    x1="40"
    y1="25"
    x2="1260"
    y2="25"
    stroke="#333333"/>


  <line
    x1="40"
    y1="25"
    x2="250"
    y2="25"
    stroke="#FFFFFF"
    stroke-width="2"
    filter="url(#glow)">

    <animate
      attributeName="x2"
      values="250;900;250"
      dur="5s"
      repeatCount="indefinite"/>

  </line>


  <!-- ================================================= -->
  <!-- MOVING PARTICLES -->
  <!-- ================================================= -->

  <g fill="#FFFFFF">

    <circle cx="100" cy="80" r="1.5">

      <animate
        attributeName="cx"
        values="100;1200;100"
        dur="12s"
        repeatCount="indefinite"/>

      <animate
        attributeName="opacity"
        values=".15;1;.15"
        dur="3s"
        repeatCount="indefinite"/>

    </circle>


    <circle cx="300" cy="190" r="1">

      <animate
        attributeName="cx"
        values="300;1100;300"
        dur="10s"
        repeatCount="indefinite"/>

    </circle>


    <circle cx="900" cy="75" r="1.5">

      <animate
        attributeName="cy"
        values="75;210;75"
        dur="8s"
        repeatCount="indefinite"/>

    </circle>


    <circle cx="1150" cy="180" r="1">

      <animate
        attributeName="cx"
        values="1150;500;1150"
        dur="9s"
        repeatCount="indefinite"/>

    </circle>


    <circle cx="650" cy="130" r="1">

      <animate
        attributeName="cy"
        values="130;50;130"
        dur="6s"
        repeatCount="indefinite"/>

    </circle>

  </g>


  <!-- ================================================= -->
  <!-- NETWORK LINES -->
  <!-- ================================================= -->

  <g
    fill="none"
    stroke="#FFFFFF"
    stroke-width="1"
    opacity=".13">

    <path
      d="M80 190 L260 90 L470 170 L680 70 L900 170 L1120 90 L1240 190">

      <animate
        attributeName="stroke-dashoffset"
        from="500"
        to="0"
        dur="8s"
        repeatCount="indefinite"/>

    </path>


    <path
      d="M150 60 L360 210 L570 80 L780 205 L1000 65 L1180 205"
      stroke-dasharray="6 12">

      <animate
        attributeName="stroke-dashoffset"
        from="200"
        to="0"
        dur="5s"
        repeatCount="indefinite"/>

    </path>

  </g>


  <!-- ================================================= -->
  <!-- MAIN TERMINAL -->
  <!-- ================================================= -->

  <text
    x="650"
    y="78"
    fill="#666666"
    font-family="monospace"
    font-size="10"
    text-anchor="middle">

    CONNECTION_TERMINATED // SESSION_COMPLETE

  </text>


  <text
    x="650"
    y="125"
    fill="#FFFFFF"
    font-family="monospace"
    font-size="25"
    font-weight="700"
    text-anchor="middle"
    filter="url(#glow)">

    &gt; KEEP_BUILDING_

    <animate
      attributeName="opacity"
      values="1;.55;1"
      dur="2.5s"
      repeatCount="indefinite"/>

  </text>


  <!-- ================================================= -->
  <!-- GLITCH TEXT -->
  <!-- ================================================= -->

  <text
    x="650"
    y="155"
    fill="#888888"
    font-family="monospace"
    font-size="10"
    text-anchor="middle">

    CODE  •  SECURE  •  AUTOMATE  •  BUILD

    <animate
      attributeName="opacity"
      values="1;.3;1;1"
      dur="4s"
      repeatCount="indefinite"/>

  </text>


  <!-- ================================================= -->
  <!-- STATUS -->
  <!-- ================================================= -->

  <circle
    cx="590"
    cy="195"
    r="4"
    fill="#FFFFFF"
    filter="url(#strongGlow)">

    <animate
      attributeName="opacity"
      values=".2;1;.2"
      dur="1.3s"
      repeatCount="indefinite"/>

  </circle>


  <text
    x="605"
    y="199"
    fill="#AAAAAA"
    font-family="monospace"
    font-size="10">

    SYSTEM ONLINE

  </text>


  <!-- ================================================= -->
  <!-- FOOTER ID -->
  <!-- ================================================= -->

  <text
    x="40"
    y="235"
    fill="#555555"
    font-family="monospace"
    font-size="9">

    MUTHair_SYED // DEVSECOPS // SECURITY // ENGINEERING

  </text>


  <text
    x="1260"
    y="235"
    fill="#555555"
    font-family="monospace"
    font-size="9"
    text-anchor="end">

    [ END_OF_TRANSMISSION ]

  </text>


  <!-- ================================================= -->
  <!-- SCANNING LINE -->
  <!-- ================================================= -->

  <rect
    x="0"
    y="35"
    width="1300"
    height="1"
    fill="#FFFFFF"
    opacity=".12">

    <animate
      attributeName="y"
      values="35;225;35"
      dur="7s"
      repeatCount="indefinite"/>

  </rect>


</svg>
