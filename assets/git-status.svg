<svg xmlns="http://www.w3.org/2000/svg"
     width="1300"
     height="560"
     viewBox="0 0 1300 560">

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#0b0d10"/>
    </linearGradient>

    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111419"/>
      <stop offset="100%" stop-color="#050607"/>
    </linearGradient>

    <pattern id="grid"
             width="45"
             height="45"
             patternUnits="userSpaceOnUse">
      <path d="M45 0H0V45"
            fill="none"
            stroke="#ffffff"
            stroke-opacity=".05"
            stroke-width="1"/>
    </pattern>

    <pattern id="scan"
             width="1"
             height="8"
             patternUnits="userSpaceOnUse">
      <rect width="1"
            height="1"
            fill="#ffffff"
            opacity=".025"/>
    </pattern>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- BACKGROUND -->

  <rect width="1300"
        height="560"
        fill="url(#bg)"/>

  <rect width="1300"
        height="560"
        fill="url(#grid)"/>

  <rect width="1300"
        height="560"
        fill="url(#scan)"/>


  <!-- PARTICLES -->

  <g fill="#ffffff">

    <circle cx="70" cy="80" r="2">
      <animate attributeName="opacity"
               values=".1;.9;.1"
               dur="3s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="210" cy="130" r="1.5">
      <animate attributeName="cy"
               values="130;150;130"
               dur="4s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="430" cy="70" r="2">
      <animate attributeName="opacity"
               values=".1;1;.1"
               dur="2.7s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="700" cy="115" r="1.5">
      <animate attributeName="cy"
               values="115;135;115"
               dur="3.6s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="950" cy="75" r="2">
      <animate attributeName="opacity"
               values=".2;1;.2"
               dur="3s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="1190" cy="135" r="1.5">
      <animate attributeName="opacity"
               values=".1;.8;.1"
               dur="3.5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="110" cy="470" r="2">
      <animate attributeName="cy"
               values="470;450;470"
               dur="4s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="380" cy="500" r="1.5">
      <animate attributeName="opacity"
               values=".2;1;.2"
               dur="3s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="760" cy="470" r="2">
      <animate attributeName="cy"
               values="470;490;470"
               dur="3.7s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="1120" cy="500" r="1.5">
      <animate attributeName="opacity"
               values=".1;.9;.1"
               dur="2.8s"
               repeatCount="indefinite"/>
    </circle>

  </g>


  <!-- TITLE -->

  <text x="650"
        y="58"
        text-anchor="middle"
        fill="#ffffff"
        font-family="monospace"
        font-size="28"
        font-weight="bold"
        letter-spacing="6"
        filter="url(#glow)">

    GIT_STATUS.exe

    <animate attributeName="opacity"
             values="1;.55;1"
             dur="3s"
             repeatCount="indefinite"/>

  </text>

  <text x="650"
        y="86"
