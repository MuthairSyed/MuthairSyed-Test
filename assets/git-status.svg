  <!-- LEFT STATUS -->

  <text x="85"
        y="160"
        fill="#777777"
        font-family="monospace"
        font-size="12">

    &gt; REPOSITORIES

  </text>

  <text x="300"
        y="160"
        fill="#ffffff"
        font-family="monospace"
        font-size="18"
        font-weight="bold">

    15

  </text>

  <text x="350"
        y="160"
        fill="#666666"
        font-family="monospace"
        font-size="11">

    PUBLIC

  </text>


  <text x="85"
        y="200"
        fill="#777777"
        font-family="monospace"
        font-size="12">

    &gt; GITHUB

  </text>

  <text x="300"
        y="200"
        fill="#ffffff"
        font-family="monospace"
        font-size="12">

    ACTIVE

  </text>


  <text x="85"
        y="240"
        fill="#777777"
        font-family="monospace"
        font-size="12">

