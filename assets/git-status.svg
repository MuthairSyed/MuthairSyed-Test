<svg xmlns="http://www.w3.org/2000/svg"
     width="1300"
     height="560"
     viewBox="0 0 1300 560">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#0b0d10"/>
    </linearGradient>

    <!-- Panels -->
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111419"/>
      <stop offset="100%" stop-color="#050607"/>
    </linearGradient>

    <!-- Grid -->
    <pattern id="grid"
             width="45"
             height="45"
             patternUnits="userSpaceOnUse">

      <path d="M45 0H0V45"
            fill="none"
            stroke="#ffffff"
            stroke-opacity=".05"
            stroke-width="1"/>

    </pattern>

    <!-- Scanlines -->
    <pattern id="scan"
             width="1"
             height="8"
             patternUnits="userSpaceOnUse">

      <rect width="1"
            height="1"
            fill="#ffffff"
            opacity=".025"/>

    </pattern>

    <!-- Glow -->
    <filter id="glow">

      <feGaussianBlur
        stdDeviation="3"
        result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

  </defs>


  <!-- ========================================================= -->
  <!-- BACKGROUND                                                -->
  <!-- ========================================================= -->

  <rect width="1300"
        height="560"
        fill="url(#bg)"/>

  <rect width="1300"
        height="560"
        fill="url(#grid)"/>

  <rect width="1300"
        height="560"
        fill="url(#scan)"/>


  <!-- ========================================================= -->
  <!-- MOVING PARTICLES                                          -->
  <!-- ========================================================= -->

  <g fill="#ffffff">

    <circle cx="70" cy="80" r="2">

      <animate
        attributeName="opacity"
        values=".1;.9;.1"
        dur="3s"
        repeatCount="indefinite"/>

    </circle>


    <circle cx="210" cy="130" r="1.5">

      <animate
        attributeName="cy"
        values="130;150;130"
        dur="4s"
        repeatCount="indefinite"/>

    </circle>


    <circle cx="430" cy="70" r="2">

      <animate
        attributeName="opacity"
        values=".1;1;.1"
        dur="2.7s"
        repeatCount="indefinite"/>

    </circle>


    <circle cx="700" cy="115" r="1.5">

      <animate
        attributeName="cy"
        values="115;135;115"
        dur="3.6s"
        repeatCount="indefinite"/>

    </circle>


    <circle cx="950" cy="75" r="2">

      <animate
        attributeName="opacity"
        values=".2;1;.2"
        dur="3s"
        repeatCount="indefinite"/>

    </circle>


    <circle cx="1190" cy="135" r="1.5">

      <animate
        attributeName="opacity"
        values=".1;.8;.1"
        dur="3.5s"
        repeatCount="indefinite"/>

    </circle>


    <circle cx="110" cy="470" r="2">

      <animate
        attributeName="cy"
        values="470;450;470"
        dur="4s"
        repeatCount="indefinite"/>

    </circle>


    <circle cx="380" cy="500" r="1.5">

      <animate
        attributeName="opacity"
        values=".2;1;.2"
        dur="3s"
        repeatCount="indefinite"/>

    </circle>


    <circle cx="760" cy="470" r="2">

      <animate
        attributeName="cy"
        values="470;490;470"
        dur="3.7s"
        repeatCount="indefinite"/>

    </circle>


    <circle cx="1120" cy="500" r="1.5">

      <animate
        attributeName="opacity"
        values=".1;.9;.1"
        dur="2.8s"
        repeatCount="indefinite"/>

    </circle>

  </g>


  <!-- ========================================================= -->
  <!-- TITLE                                                      -->
  <!-- ========================================================= -->

  <text x="650"
        y="58"
        text-anchor="middle"
        fill="#ffffff"
        font-family="monospace"
        font-size="28"
        font-weight="bold"
        letter-spacing="6"
        filter="url(#glow)">

    GIT_STATUS.exe

    <animate
      attributeName="opacity"
      values="1;.55;1"
      dur="3s"
      repeatCount="indefinite"/>

  </text>


  <text x="650"
        y="86"
        text-anchor="middle"
        fill="#666666"
        font-family="monospace"
        font-size="11"
        letter-spacing="3">

    // VERSION CONTROL // REPOSITORIES // CONTRIBUTIONS

  </text>


  <!-- ========================================================= -->
  <!-- ONLINE STATUS                                              -->
  <!-- ========================================================= -->

  <circle cx="1140"
          cy="58"
          r="5"
          fill="#ffffff"
          filter="url(#glow)">

    <animate
      attributeName="opacity"
      values="1;.2;1"
      dur="1.3s"
      repeatCount="indefinite"/>

  </circle>


  <text x="1155"
        y="63"
        fill="#ffffff"
        font-family="monospace"
        font-size="11">

    ONLINE

  </text>


  <!-- ========================================================= -->
  <!-- MAIN PANEL                                                 -->
  <!-- ========================================================= -->

  <rect x="55"
        y="115"
        width="1190"
        height="350"
        rx="4"
        fill="url(#panel)"
        stroke="#ffffff"
        stroke-opacity=".25"/>


  <!-- HUD CORNERS -->

  <path d="M55 155V115H95"
        stroke="#ffffff"
        stroke-width="2"
        fill="none"/>


  <path d="M1205 465H1245V425"
        stroke="#ffffff"
        stroke-width="2"
        fill="none"/>


  <!-- ========================================================= -->
  <!-- REPOSITORIES                                               -->
  <!-- ========================================================= -->

  <text x="85"
        y="160"
        fill="#777777"
        font-family="monospace"
        font-size="12">

    &gt; REPOSITORIES

  </text>


  <text x="300"
        y="160"
        fill="#ffffff"
        font-family="monospace"
        font-size="18"
        font-weight="bold">

    <!-- GITHUB_REPOSITORIES -->

  </text>


  <text x="350"
        y="160"
        fill="#666666"
        font-family="monospace"
        font-size="11">

    PUBLIC

  </text>


  <!-- ========================================================= -->
  <!-- FOLLOWERS                                                  -->
  <!-- ========================================================= -->

  <text x="85"
        y="200"
        fill="#777777"
        font-family="monospace"
        font-size="12">

    &gt; FOLLOWERS

  </text>


  <text x="300"
        y="200"
        fill="#ffffff"
        font-family="monospace"
        font-size="15"
        font-weight="bold">

    <!-- GITHUB_FOLLOWERS -->

  </text>


  <!-- ========================================================= -->
  <!-- FOLLOWING                                                  -->
  <!-- ========================================================= -->

  <text x="85"
        y="240"
        fill="#777777"
        font-family="monospace"
        font-size="12">

    &gt; FOLLOWING

  </text>


  <text x="300"
        y="240"
        fill="#ffffff"
        font-family="monospace"
        font-size="15"
        font-weight="bold">

    <!-- GITHUB_FOLLOWING -->

  </text>


  <!-- ========================================================= -->
  <!-- STARS                                                      -->
  <!-- ========================================================= -->

  <text x="85"
        y="280"
        fill="#777777"
        font-family="monospace"
        font-size="12">

    &gt; TOTAL_STARS

  </text>


  <text x="300"
        y="280"
        fill="#ffffff"
        font-family="monospace"
        font-size="15"
        font-weight="bold">

    <!-- GITHUB_STARS -->

  </text>


  <!-- ========================================================= -->
  <!-- FORKS                                                      -->
  <!-- ========================================================= -->

  <text x="85"
        y="320"
        fill="#777777"
        font-family="monospace"
        font-size="12">

    &gt; TOTAL_FORKS

  </text>


  <text x="300"
        y="320"
        fill="#ffffff"
        font-family="monospace"
        font-size="15"
        font-weight="bold">

    <!-- GITHUB_FORKS -->

  </text>


  <!-- ========================================================= -->
  <!-- DATA SOURCE                                                -->
  <!-- ========================================================= -->

  <text x="85"
        y="360"
        fill="#777777"
        font-family="monospace"
        font-size="12">

    &gt; DATA_SOURCE

  </text>


  <text x="300"
        y="360"
        fill="#ffffff"
        font-family="monospace"
        font-size="12">

    GITHUB API

  </text>


  <!-- ========================================================= -->
  <!-- DIVIDER                                                    -->
  <!-- ========================================================= -->

  <line x1="520"
        y1="145"
        x2="520"
        y2="430"
        stroke="#ffffff"
        stroke-opacity=".12"/>


  <!-- ========================================================= -->
  <!-- ACTIVITY                                                   -->
  <!-- ========================================================= -->

  <text x="565"
        y="160"
        fill="#ffffff"
        font-family="monospace"
        font-size="15"
        font-weight="bold">

    GITHUB_ACTIVITY

  </text>


  <text x="565"
        y="185"
        fill="#666666"
        font-family="monospace"
        font-size="10">

    // LIVE REPOSITORY ACTIVITY //

  </text>


  <!-- ========================================================= -->
  <!-- LATEST COMMIT                                              -->
  <!-- ========================================================= -->

  <text x="565"
        y="220"
        fill="#777777"
        font-family="monospace"
        font-size="11">

    &gt; LATEST_COMMIT

  </text>


  <text x="565"
        y="245"
        fill="#ffffff"
        font-family="monospace"
        font-size="12">

    <!-- GITHUB_LATEST_COMMIT -->

  </text>


  <!-- ========================================================= -->
  <!-- LAST ACTIVITY                                              -->
  <!-- ========================================================= -->

  <text x="565"
        y="280"
        fill="#777777"
        font-family="monospace"
        font-size="11">

    &gt; LAST_ACTIVITY

  </text>


  <text x="565"
        y="305"
        fill="#ffffff"
        font-family="monospace"
        font-size="12">

    <!-- GITHUB_LAST_ACTIVITY -->

  </text>


  <!-- ========================================================= -->
  <!-- UPDATED                                                    -->
  <!-- ========================================================= -->

  <text x="565"
        y="340"
        fill="#777777"
        font-family="monospace"
        font-size="11">

    &gt; DATA_UPDATED

  </text>


  <text x="565"
        y="365"
        fill="#ffffff"
        font-family="monospace"
        font-size="12">

    <!-- GITHUB_UPDATED -->

  </text>


  <!-- ========================================================= -->
  <!-- LIVE INDICATOR                                             -->
  <!-- ========================================================= -->

  <circle cx="570"
          cy="405"
          r="4"
          fill="#ffffff"
          filter="url(#glow)">

    <animate
      attributeName="opacity"
      values="1;.2;1"
      dur="1.5s"
      repeatCount="indefinite"/>

  </circle>


  <text x="585"
        y="410"
        fill="#ffffff"
        font-family="monospace"
        font-size="11">

    LIVE DATA PIPELINE ACTIVE

  </text>


  <!-- ========================================================= -->
  <!-- SCANNING LINE                                              -->
  <!-- ========================================================= -->

  <rect x="560"
        y="205"
        width="310"
        height="3"
        fill="#ffffff"
        opacity=".08">

    <animate
      attributeName="y"
      values="205;305;405;205"
      dur="4s"
      repeatCount="indefinite"/>

  </rect>


  <!-- ========================================================= -->
  <!-- GIT COMMAND                                                -->
  <!-- ========================================================= -->

  <text x="85"
        y="410"
        fill="#777777"
        font-family="monospace"
        font-size="11">

    &gt; git status

  </text>


  <text x="185"
        y="410"
        fill="#ffffff"
        font-family="monospace"
        font-size="11">

    working tree clean

  </text>


  <!-- ========================================================= -->
  <!-- BOTTOM STATUS                                              -->
  <!-- ========================================================= -->

  <line x1="85"
        y1="425"
        x2="1215"
        y2="425"
        stroke="#ffffff"
        stroke-opacity=".12"/>


  <text x="85"
        y="450"
        fill="#777777"
        font-family="monospace"
        font-size="11">

    &gt; SYSTEM:

  </text>


  <text x="165"
        y="450"
        fill="#ffffff"
        font-family="monospace"
        font-size="11">

    OPERATIONAL

  </text>


  <text x="440"
        y="450"
        fill="#777777"
        font-family="monospace"
        font-size="11">

    &gt; AUTOMATION:

  </text>


  <text x="545"
        y="450"
        fill="#ffffff"
        font-family="monospace"
        font-size="11">

    ENABLED

  </text>


  <text x="760"
        y="450"
        fill="#777777"
        font-family="monospace"
        font-size="11">

    &gt; SOURCE:

  </text>


  <text x="840"
        y="450"
        fill="#ffffff"
        font-family="monospace"
        font-size="11">

    GITHUB

  </text>


  <!-- ========================================================= -->
  <!-- TERMINAL CURSOR                                           -->
  <!-- ========================================================= -->

  <text x="85"
        y="505"
        fill="#ffffff"
        font-family="monospace"
        font-size="12">

    &gt; GIT_STATUS_READY_

    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="1s"
      repeatCount="indefinite"/>

  </text>


  <!-- ========================================================= -->
  <!-- FOOTER                                                     -->
  <!-- ========================================================= -->

  <text x="650"
        y="535"
        text-anchor="middle"
        fill="#555555"
        font-family="monospace"
        font-size="10"
        letter-spacing="3">

    BUILD → COMMIT → PUSH → DEPLOY

  </text>

</svg>
