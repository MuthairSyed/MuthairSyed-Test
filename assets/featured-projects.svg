<svg xmlns="http://www.w3.org/2000/svg"
     width="1300"
     height="900"
     viewBox="0 0 1300 900">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#0b0d10"/>
    </linearGradient>

    <!-- Card -->
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101318"/>
      <stop offset="100%" stop-color="#050607"/>
    </linearGradient>

    <!-- Grid -->
    <pattern id="grid"
             width="45"
             height="45"
             patternUnits="userSpaceOnUse">
      <path d="M45 0 L0 0 0 45"
            fill="none"
            stroke="#ffffff"
            stroke-opacity="0.055"
            stroke-width="1"/>
    </pattern>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- BACKGROUND -->
  <rect width="1300" height="900" fill="url(#bg)"/>
  <rect width="1300" height="900" fill="url(#grid)"/>


  <!-- HEADER -->

  <text x="650"
        y="65"
        text-anchor="middle"
        fill="#ffffff"
        font-family="monospace"
        font-size="30"
        font-weight="bold"
        letter-spacing="6"
        filter="url(#glow)">
    FEATURED PROJECTS
  </text>

  <text x="650"
        y="95"
        text-anchor="middle"
        fill="#777777"
        font-family="monospace"
        font-size="12"
        letter-spacing="3">
    // SELECTED SYSTEMS // SECURITY // AUTOMATION // DEVELOPMENT
  </text>

  <line x1="70"
        y1="120"
        x2="1230"
        y2="120"
        stroke="#ffffff"
        stroke-opacity=".25"/>


  <!-- ===================================================== -->
  <!-- PROJECT 1 : AI RAM BOOSTER -->
  <!-- ===================================================== -->

  <rect x="55"
        y="150"
        width="585"
        height="300"
        rx="5"
        fill="url(#card)"
        stroke="#ffffff"
        stroke-opacity=".25"/>

  <!-- Corner -->
  <path d="M55 185 V150 H90"
        stroke="#ffffff"
        stroke-width="2"
        fill="none"/>

  <!-- Status -->
  <circle cx="610"
          cy="180"
          r="5"
          fill="#ffffff"
          filter="url(#glow)">
    <animate attributeName="opacity"
             values="1;.2;1"
             dur="1.5s"
             repeatCount="indefinite"/>
  </circle>

  <text x="85"
        y="205"
        fill="#ffffff"
        font-family="monospace"
        font-size="23"
        font-weight="bold">
    AI RAM BOOSTER
  </text>

  <text x="85"
        y="240"
        fill="#777777"
        font-family="monospace"
        font-size="11">
    SYSTEM OPTIMIZATION / PERFORMANCE
  </text>

  <text x="85"
        y="280"
        fill="#bbbbbb"
        font-family="monospace"
        font-size="12">
    Windows optimization utility focused
  </text>

  <text x="85"
        y="303"
        fill="#bbbbbb"
        font-family="monospace"
        font-size="12">
    on RAM management and gaming performance.
  </text>

  <text x="85"
        y="350"
        fill="#ffffff"
        font-family="monospace"
        font-size="11">
    [ Python ] [ JavaScript ] [ Electron ]
  </text>

  <text x="85"
        y="375"
        fill="#ffffff"
        font-family="monospace"
        font-size="11">
    [ Node.js ] [ Windows ]
  </text>

  <text x="85"
        y="420"
        fill="#777777"
        font-family="monospace"
        font-size="11">
    &gt; STATUS:
  </text>

  <text x="170"
        y="420"
        fill="#ffffff"
        font-family="monospace"
        font-size="11">
    ACTIVE
  </text>

  <text x="510"
        y="420"
        fill="#ffffff"
        font-family="monospace"
        font-size="11">
    GITHUB ↗
  </text>


