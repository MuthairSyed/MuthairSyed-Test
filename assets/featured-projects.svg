<svg xmlns="http://www.w3.org/2000/svg"
     width="900"
     height="590"
     viewBox="0 0 900 590">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#0b0d10"/>
    </linearGradient>

    <!-- Card -->
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101318"/>
      <stop offset="100%" stop-color="#050607"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid -->
    <pattern id="grid"
             width="32"
             height="32"
             patternUnits="userSpaceOnUse">
      <path d="M32 0 L0 0 0 32"
            fill="none"
            stroke="#ffffff"
            stroke-opacity="0.055"
            stroke-width="1"/>
    </pattern>

    <!-- Scanline -->
    <pattern id="scan"
             width="1"
             height="8"
             patternUnits="userSpaceOnUse">
      <rect width="1" height="1"
            fill="#ffffff"
            opacity="0.025"/>
    </pattern>

  </defs>


  <!-- ===================================================== -->
  <!-- BACKGROUND -->
  <!-- ===================================================== -->

  <rect width="900"
        height="590"
        fill="url(#bg)"/>

  <rect width="900"
        height="590"
        fill="url(#grid)"/>

  <rect width="900"
        height="590"
        fill="url(#scan)"/>


  <!-- ===================================================== -->
  <!-- PARTICLES -->
  <!-- ===================================================== -->

  <g fill="#ffffff">

    <circle cx="45" cy="55" r="1.5" opacity=".6">
      <animate attributeName="opacity"
               values=".1;.8;.1"
               dur="3s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="155" cy="95" r="1"
            opacity=".5"/>

    <circle cx="280" cy="48" r="1.5"
            opacity=".6">
      <animate attributeName="cy"
               values="48;60;48"
               dur="4s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="430" cy="85" r="1"
            opacity=".6"/>

    <circle cx="610" cy="48" r="1.5"
            opacity=".6">
      <animate attributeName="opacity"
               values=".2;.9;.2"
               dur="3s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="760" cy="90" r="1"
            opacity=".5"/>

    <circle cx="850" cy="55" r="1.5"
            opacity=".6">
      <animate attributeName="opacity"
               values=".1;.8;.1"
               dur="2.8s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="80" cy="530" r="1.5"
            opacity=".5"/>

    <circle cx="260" cy="550" r="1"
            opacity=".6"/>

    <circle cx="470" cy="525" r="1.5"
            opacity=".5"/>

    <circle cx="690" cy="550" r="1"
            opacity=".6"/>

    <circle cx="835" cy="525" r="1.5"
            opacity=".5"/>

  </g>


  <!-- ===================================================== -->
  <!-- CONNECTION LINES -->
  <!-- ===================================================== -->

  <g stroke="#ffffff"
     stroke-opacity=".1"
     fill="none">

    <path d="M45 55 L155 95 L280 48 L430 85">
      <animate attributeName="stroke-opacity"
               values=".03;.18;.03"
               dur="4s"
               repeatCount="indefinite"/>
    </path>

    <path d="M610 48 L760 90 L850 55">
      <animate attributeName="stroke-opacity"
               values=".03;.18;.03"
               dur="5s"
               repeatCount="indefinite"/>
    </path>

    <path d="M80 530 L260 550 L470 525 L690 550 L835 525">
      <animate attributeName="stroke-opacity"
               values=".03;.15;.03"
               dur="4.5s"
               repeatCount="indefinite"/>
    </path>

  </g>


