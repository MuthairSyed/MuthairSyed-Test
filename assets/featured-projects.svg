  <!-- FOOTER LINE -->

  <line x1="70"
        y1="825"
        x2="1230"
        y2="825"
        stroke="#ffffff"
        stroke-opacity=".18"/>

  <text x="650"
        y="855"
        text-anchor="middle"
        fill="#555555"
        font-family="monospace"
        font-size="10"
