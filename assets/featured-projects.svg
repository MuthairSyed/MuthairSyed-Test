  <text x="690"
        y="540"
        fill="#ffffff"
        font-family="monospace"
        font-size="23"
        font-weight="bold">
    YOUTUBE PORTFOLIO
  </text>

  <text x="690"
        y="575"
        fill="#777777"
        font-family="monospace"
        font-size="11">
    GAMING / YOUTUBE / WEB EXPERIENCE
  </text>

  <text x="690"
        y="615"
        fill="#bbbbbb"
        font-family="monospace"
        font-size="12">
    Interactive gaming and YouTube portfolio
  </text>

  <text x="690"
        y="638"
        fill="#bbbbbb"
        font-family="monospace"
        font-size="12">
    featuring content and channel statistics.
  </text>

  <text x="690"
        y="685"
        fill="#ffffff"
        font-family="monospace"
        font-size="11">
    [ PHP ] [ JavaScript ] [ HTML ] [ CSS ]
  </text>

  <text x="690"
        y="710"
        fill="#ffffff"
        font-family="monospace"
