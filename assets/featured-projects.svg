  <rect x="55"
        y="485"
        width="585"
        height="300"
        rx="5"
        fill="url(#card)"
        stroke="#ffffff"
        stroke-opacity=".25"/>

  <path d="M55 520 V485 H90"
        stroke="#ffffff"
