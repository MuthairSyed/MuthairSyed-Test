<svg xmlns="http://www.w3.org/2000/svg"
     width="1300"
     height="820"
     viewBox="0 0 1300 820">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#0b0d10"/>
    </linearGradient>

    <!-- Card -->
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101318"/>
      <stop offset="100%" stop-color="#050607"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Strong glow -->
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid -->
    <pattern id="grid"
             width="45"
             height="45"
             patternUnits="userSpaceOnUse">
      <path d="M 45 0 L 0 0 0 45"
            fill="none"
            stroke="#ffffff"
            stroke-opacity="0.055"
            stroke-width="1"/>
    </pattern>

    <!-- Scanline -->
    <pattern id="scan"
             width="1"
             height="8"
             patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#ffffff" opacity="0.025"/>
    </pattern>

  </defs>

  <!-- BACKGROUND -->
  <rect width="1300" height="820" fill="url(#bg)"/>
  <rect width="1300" height="820" fill="url(#grid)"/>
  <rect width="1300" height="820" fill="url(#scan)"/>

  <!-- PARTICLES -->
  <g fill="#ffffff">

    <circle cx="70" cy="90" r="2" opacity=".7">
      <animate attributeName="opacity"
