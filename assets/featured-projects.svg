        stroke-opacity=".25"/>

  <path d="M660 520 V485 H695"
        stroke="#ffffff"
        stroke-width="2"
        fill="none"/>

  <circle cx="1215"
          cy="515"
          r="5"
          fill="#ffffff"
          filter="url(#glow)">
    <animate attributeName="opacity"
             values="1;.2;1"
             dur="1.6s"
             repeatCount="indefinite"/>
