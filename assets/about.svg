<svg xmlns="http://www.w3.org/2000/svg"
     width="1300"
     height="760"
     viewBox="0 0 1300 760">

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020202"/>
      <stop offset="100%" stop-color="#0b0f14"/>
    </linearGradient>

    <pattern id="grid"
             width="32"
             height="32"
             patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32"
            fill="none"
            stroke="#ffffff"
            stroke-opacity=".055"/>
    </pattern>

    <linearGradient id="scan"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <circle id="particle"
            r="1.5"
            fill="#ffffff"/>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND -->
  <!-- ================================================= -->

  <rect width="1300"
        height="760"
        fill="url(#bg)"/>

  <rect width="1300"
        height="760"
        fill="url(#grid)"/>


  <!-- ================================================= -->
  <!-- OUTER FRAME -->
  <!-- ================================================= -->

  <rect x="22"
        y="22"
        width="1256"
        height="716"
        rx="8"
        fill="none"
        stroke="#ffffff"
        stroke-opacity=".20"/>

  <path d="M22 60H180"
        stroke="#ffffff"
        stroke-opacity=".35"/>

  <path d="M1120 60H1278"
        stroke="#ffffff"
        stroke-opacity=".35"/>


  <!-- ================================================= -->
  <!-- PARTICLES -->
  <!-- ================================================= -->

  <g fill="#ffffff">

    <use href="#particle" x="90" y="120">
      <animate attributeName="opacity"
               values=".1;.9;.1"
               dur="3s"
               repeatCount="indefinite"/>
    </use>

    <use href="#particle" x="250" y="180">
      <animate attributeName="opacity"
               values=".2;.8;.2"
               dur="4s"
               repeatCount="indefinite"/>
    </use>

    <use href="#particle" x="470" y="105">
      <animate attributeName="opacity"
               values=".1;.9;.1"
               dur="3.5s"
               repeatCount="indefinite"/>
    </use>

    <use href="#particle" x="760" y="140">
      <animate attributeName="opacity"
               values=".2;.9;.2"
               dur="4.2s"
               repeatCount="indefinite"/>
