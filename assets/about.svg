    <use href="#particle" x="1080" y="190">
      <animate attributeName="opacity"
               values=".1;.8;.1"
               dur="3.2s"
               repeatCount="indefinite"/>
    </use>

    <use href="#particle" x="1180" y="500">
      <animate attributeName="opacity"
               values=".2;.9;.2"
               dur="4s"
               repeatCount="indefinite"/>
