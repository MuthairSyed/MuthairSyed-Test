               repeatCount="indefinite"/>
    </use>

    <use href="#particle" x="850" y="650">
      <animate attributeName="opacity"
               values=".2;.9;.2"
               dur="4.5s"
               repeatCount="indefinite"/>
    </use>

  </g>


