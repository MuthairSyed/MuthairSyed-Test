<svg xmlns="http://www.w3.org/2000/svg"
     width="650"
     height="330"
     viewBox="0 0 650 330">

  <defs>

    <linearGradient id="fade"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">

      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#0D0D0D"/>

    </linearGradient>

    <filter id="glow">

      <feGaussianBlur stdDeviation="2"
                      result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

  </defs>


  <!-- BACKGROUND -->

  <rect width="650"
        height="330"
        fill="url(#fade)"/>


  <!-- GRID -->

  <g stroke="#161616"
     stroke-width="1"
     opacity=".7">

    <path d="M0 55H650"/>
    <path d="M0 110H650"/>
    <path d="M0 165H650"/>
    <path d="M0 220H650"/>
    <path d="M0 275H650"/>

    <path d="M65 0V330"/>
    <path d="M130 0V330"/>
    <path d="M195 0V330"/>
    <path d="M260 0V330"/>
    <path d="M325 0V330"/>
    <path d="M390 0V330"/>
    <path d="M455 0V330"/>
    <path d="M520 0V330"/>
    <path d="M585 0V330"/>

  </g>


  <!-- FRAME -->

  <rect x="18"
        y="18"
        width="614"
        height="294"
        fill="none"
        stroke="#333333"
        stroke-width="1"/>


  <!-- CORNERS -->

  <path d="M18 60V18H60"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="2"/>

  <path d="M590 18H632V60"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="2"/>

  <path d="M18 270V312H60"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="2"/>

  <path d="M590 312H632V270"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="2"/>


  <!-- TERMINAL HEADER -->

  <text x="42"
