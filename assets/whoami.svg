  </text>


  <text x="42"
        y="255"
        fill="#777777"
        font-family="monospace"
        font-size="12">

    STACK

  </text>

  <text x="190"
        y="255"
        fill="#FFFFFF"
        font-family="monospace"
        font-size="12">

    Python • Azure • GitHub • Linux

  </text>


  <!-- TERMINAL CURSOR -->

  <text x="42"
        y="285"
        fill="#FFFFFF"
        font-family="monospace"
