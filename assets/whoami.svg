  <!-- PROFILE DATA -->

  <text x="42"
        y="135"
        fill="#777777"
        font-family="monospace"
        font-size="12">

    NAME

  </text>

  <text x="190"
        y="135"
        fill="#FFFFFF"
        font-family="monospace"
        font-size="12">

    Muthair Syed

  </text>


  <text x="42"
        y="165"
        fill="#777777"
        font-family="monospace"
        font-size="12">

