<svg xmlns="http://www.w3.org/2000/svg"
     width="1400"
     height="300"
     viewBox="0 0 1400 300">

  <defs>

    <linearGradient id="bg"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">

      <stop offset="0%" stop-color="#000000"/>
      <stop offset="50%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#000000"/>

    </linearGradient>

    <pattern id="grid"
             width="70"
             height="42"
             patternUnits="userSpaceOnUse">

      <path d="M70 0H0V42"
            fill="none"
            stroke="#181818"
            stroke-width="1"/>

    </pattern>

    <filter id="glow">

      <feGaussianBlur stdDeviation="3"
                      result="blur"/>

      <feMerge>

        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>

      </feMerge>

    </filter>

  </defs>


  <!-- ================================= -->
  <!-- BACKGROUND                         -->
  <!-- ================================= -->

  <rect width="1400"
        height="300"
        fill="url(#bg)"/>

  <rect width="1400"
        height="300"
        fill="url(#grid)"/>


  <!-- ================================= -->
  <!-- FLOATING PARTICLES                 -->
  <!-- ================================= -->

  <g fill="#FFFFFF">

    <circle cx="80" cy="80" r="2">

      <animate attributeName="cx"
               values="80;180;80"
               dur="8s"
               repeatCount="indefinite"/>

      <animate attributeName="cy"
               values="80;130;80"
               dur="7s"
               repeatCount="indefinite"/>

      <animate attributeName="opacity"
               values=".15;1;.15"
               dur="3s"
               repeatCount="indefinite"/>

    </circle>


    <circle cx="220" cy="210" r="1.5">

      <animate attributeName="cx"
               values="220;130;220"
               dur="9s"
               repeatCount="indefinite"/>

      <animate attributeName="cy"
               values="210;160;210"
               dur="8s"
               repeatCount="indefinite"/>

      <animate attributeName="opacity"
               values=".1;.8;.1"
               dur="4s"
               repeatCount="indefinite"/>

    </circle>


    <circle cx="1150" cy="70" r="2">

      <animate attributeName="cx"
               values="1150;1240;1150"
               dur="8s"
               repeatCount="indefinite"/>

      <animate attributeName="cy"
               values="70;120;70"
               dur="9s"
               repeatCount="indefinite"/>

      <animate attributeName="opacity"
               values=".2;1;.2"
               dur="3s"
               repeatCount="indefinite"/>

    </circle>


    <circle cx="1280" cy="210" r="1.5">

      <animate attributeName="cx"
               values="1280;1190;1280"
               dur="10s"
               repeatCount="indefinite"/>

      <animate attributeName="cy"
               values="210;170;210"
               dur="8s"
               repeatCount="indefinite"/>

      <animate attributeName="opacity"
               values=".15;.9;.15"
               dur="3.5s"
               repeatCount="indefinite"/>

    </circle>


    <circle cx="500" cy="55" r="1.5">

      <animate attributeName="cy"
               values="55;90;55"
               dur="6s"
               repeatCount="indefinite"/>

      <animate attributeName="opacity"
               values=".1;1;.1"
               dur="2.5s"
               repeatCount="indefinite"/>

    </circle>


    <circle cx="900" cy="250" r="2">

      <animate attributeName="cy"
               values="250;210;250"
               dur="7s"
               repeatCount="indefinite"/>

      <animate attributeName="opacity"
               values=".2;1;.2"
               dur="3s"
               repeatCount="indefinite"/>

    </circle>

  </g>


  <!-- ================================= -->
  <!-- NETWORK CONNECTIONS                -->
  <!-- ================================= -->

  <g stroke="#FFFFFF"
     stroke-width="1"
     opacity=".2">

    <path d="M80 80 L220 120 L350 70">

      <animate attributeName="opacity"
               values=".05;.4;.05"
               dur="5s"
               repeatCount="indefinite"/>

    </path>


    <path d="M1080 80 L1150 70 L1280 210">

      <animate attributeName="opacity"
               values=".4;.05;.4"
               dur="6s"
               repeatCount="indefinite"/>

    </path>

  </g>


  <!-- ================================= -->
  <!-- TOP SCANLINE                       -->
  <!-- ================================= -->

  <rect x="0"
        y="0"
        width="1400"
        height="2"
        fill="#FFFFFF"
        opacity=".3">

    <animate attributeName="y"
             values="0;300;0"
             dur="5s"
             repeatCount="indefinite"/>

  </rect>


  <!-- ================================= -->
  <!-- TERMINAL FRAME                     -->
  <!-- ================================= -->

  <rect x="300"
        y="45"
        width="800"
        height="190"
        fill="none"
        stroke="#292929"
        stroke-width="1"/>


  <!-- HUD CORNERS -->

  <path d="M300 80V45H340"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="2"/>

  <path d="M1060 45H1100V80"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="2"/>

  <path d="M300 200V235H340"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="2"/>

  <path d="M1060 235H1100V200"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="2"/>


  <!-- ================================= -->
  <!-- SYSTEM STATUS                      -->
  <!-- ================================= -->

  <text x="700"
        y="92"
        fill="#FFFFFF"
        font-family="monospace"
        font-size="14"
        text-anchor="middle">

    [ SYSTEM STATUS: OPERATIONAL ]

    <animate attributeName="opacity"
             values="1;1;.3;1"
             dur="3.5s"
             repeatCount="indefinite"/>

  </text>


  <text x="700"
        y="118"
        fill="#CCCCCC"
        font-family="monospace"
        font-size="13"
        text-anchor="middle">

    [ SECURITY STATUS: ACTIVE ]

    <animate attributeName="opacity"
             values=".3;1;.3;1"
             dur="4.2s"
             repeatCount="indefinite"/>

  </text>


  <text x="700"
        y="144"
        fill="#FFFFFF"
        font-family="monospace"
        font-size="13"
        text-anchor="middle">

    [ AUTOMATION ENGINE: RUNNING ]

    <animate attributeName="opacity"
             values="1;.25;1"
             dur="4.8s"
             repeatCount="indefinite"/>

  </text>


  <text x="700"
        y="170"
        fill="#AAAAAA"
        font-family="monospace"
        font-size="13"
        text-anchor="middle">

    [ THREAT MONITORING: ONLINE ]

    <animate attributeName="opacity"
             values=".4;1;.4"
             dur="3.8s"
             repeatCount="indefinite"/>

  </text>


  <!-- ================================= -->
  <!-- CONNECTION LINE                     -->
  <!-- ================================= -->

  <text x="700"
        y="200"
        fill="#FFFFFF"
        font-family="monospace"
        font-size="12"
        text-anchor="middle">

    &gt; CONNECTION SECURED_

    <animate attributeName="opacity"
             values="1;.25;1"
             dur="2s"
             repeatCount="indefinite"/>

  </text>


  <!-- ================================= -->
  <!-- STATUS DOTS                        -->
  <!-- ================================= -->

  <circle cx="490"
          cy="91"
          r="3"
          fill="#FFFFFF"
          filter="url(#glow)">

    <animate attributeName="opacity"
             values=".2;1;.2"
             dur="1.5s"
             repeatCount="indefinite"/>

  </circle>


  <circle cx="910"
          cy="118"
          r="3"
          fill="#FFFFFF"
          filter="url(#glow)">

    <animate attributeName="opacity"
             values="1;.2;1"
             dur="1.9s"
             repeatCount="indefinite"/>

  </circle>


  <!-- ================================= -->
  <!-- FINAL MESSAGE                       -->
  <!-- ================================= -->

  <text x="700"
        y="270"
        fill="#777777"
        font-family="monospace"
        font-size="12"
        text-anchor="middle">

    BUILD → SECURE → AUTOMATE → MONITOR → REPEAT

    <animate attributeName="opacity"
             values=".35;1;.35"
             dur="4s"
             repeatCount="indefinite"/>

  </text>


</svg>
