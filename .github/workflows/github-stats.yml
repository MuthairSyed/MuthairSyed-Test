name: Update GitHub Stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch GitHub statistics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          username = "MuthairSyed"

          token = os.environ["GH_TOKEN"]

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28"
          }

          def github_api(url):
              request = urllib.request.Request(
                  url,
                  headers=headers
              )

              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          user = github_api(
              f"https://api.github.com/users/{username}"
          )

          repositories = []
          page = 1

          while True:
              data = github_api(
                  f"https://api.github.com/users/{username}/repos"
                  f"?per_page=100&page={page}&type=owner"
              )

              if not data:
                  break

              repositories.extend(data)
              page += 1

          total_stars = sum(
              repo.get("stargazers_count", 0)
              for repo in repositories
          )

          total_forks = sum(
              repo.get("forks_count", 0)
              for repo in repositories
          )

          latest_repo = (
              max(
                  repositories,
                  key=lambda repo: repo.get("pushed_at") or ""
              )
              if repositories
              else None
          )

          latest_activity = (
              latest_repo.get("pushed_at")
              if latest_repo
              else None
          )

          stats = {
              "username": username,
              "repositories": user.get("public_repos", 0),
              "followers": user.get("followers", 0),
              "following": user.get("following", 0),
              "stars": total_stars,
              "forks": total_forks,
              "latest_commit": latest_activity or "N/A",
              "last_activity": latest_activity or "N/A",
              "updated_at": datetime.now(
                  timezone.utc
              ).isoformat()
          }

          os.makedirs("data", exist_ok=True)

          with open(
              "data/github-stats.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  stats,
                  file,
                  indent=2
              )

          print(json.dumps(stats, indent=2))
          PY

      - name: Generate Git Status SVG
        run: |
          python scripts/generate-git-status.py

      - name: Commit updated statistics and SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/github-stats.json
          git add assets/git-status.svg

          if git diff --cached --quiet; then
            echo "No statistics changes."
          else
            git commit -m "chore: update GitHub statistics"
            git push
          fi
